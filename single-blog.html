<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>if(!localStorage.getItem('lang')){var b=(navigator.language||'').slice(0,2).toLowerCase();if(['en','ru','de'].indexOf(b)!==-1)localStorage.setItem('lang',b);}</script>
  <script src="../scripts/shared/analytics.js" data-cfasync="false"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Single Blog</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/components/header.css" />
  <link rel="stylesheet" href="../assets/css/components/burger-dropdown.css" />
  <link rel="stylesheet" href="../assets/css/pages/blog.css" />
  <link rel="stylesheet" href="../assets/css/pages/single-blog.css" />
  <link rel="stylesheet" href="../assets/css/components/footer.css" />
  <link rel="stylesheet" href="../assets/css/components/blog-section.css" />
  <link rel="stylesheet" href="../assets/css/components/cookie.css" />
</head>
<body>

<div id="header-placeholder"></div>
<div id="burger-dropdown-placeholder"></div>

<div class="single-blog">
  <div class="container">
    <div class="single-blog__content">
      <div class="single-blog__top-img">
        <img loading="lazy" id="top-image" src="" alt="" />
        <a class="back-btn" onclick="history.back()">
          <img loading="lazy" src="../../public/images/icons/flip-backward.svg" alt="back" />
        </a>
        <a class="share-btn">
          <img loading="lazy" src="../../public/images/icons/share.svg" alt="back" />
        </a>
        <div class="single-blog__info">
          <div class="single-blog__title"></div>
        </div>
        <div class="single-blog__tags">
        </div>
        <div class="single-blog__details">
          <div id="read-time" class="single-blog__detail"></div>
          <div id="views" class="single-blog__detail"></div>
          <div id="date" class="single-blog__detail"></div>
        </div>
      </div>
      <div class="single-blog__body">
        <div class="single-blog__text"></div>
        <div class="single-blog__nav">
          <div class="single-blog__nav__keys"></div>
<!--          <div class="single-blog__nav__btn">-->
<!--            <div class="single-blog__nav__reaction">-->
<!--              <img loading="lazy" src="../../public/images/icons/like.svg" alt="reaction" />-->
<!--              <img loading="lazy" src="../../public/images/icons/dis.svg" alt="reaction" />-->
<!--            </div>-->

<!--            <img loading="lazy" src="../../public/images/icons/shareBtn.svg" alt="plus" />-->
<!--          </div>-->
        </div>
      </div>
    </div>
    <div class="blog__new bottom-section">
      <div class="title">
        <span data-i18n="blog.page.new.titleBlue">NEW</span>
        <a data-i18n="blog.page.titleOrd">PUBLICATIONS</a>
        <p data-i18n="blog.page.new.subtitle">Open the article you are interested in to study it in more detail</p>
      </div>

      <div class="blog__new__grid"></div>

      <div class="blog__pager">
        <button id="new__pager-prev" class="pager__btn" aria-label="Previous">
          <svg
            class="icon-arrow"
            width="32" height="32"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M19 12H5M5 12L12 19M5 12L12 5"
              stroke="#475467"
              stroke-width="2.004"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <button id="new__pager-next" class="pager__btn" aria-label="Next">
          <svg
            class="icon-arrow"
            width="32" height="32"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M5 12H19M19 12L12 5M19 12L12 19"
              stroke="#475467"
              stroke-width="2.004"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="../scripts/shared/cookie.min.js"></script>
<script src="../scripts/shared/cookie.js"></script>
<script src="../scripts/shared/translations.js" defer></script>
<script src="../scripts/components/header.js" defer></script>
<script src="../scripts/components/burgerDropdownController.js" defer></script>
<script src="../scripts/shared/navButtons.js" defer></script>
<script src="../scripts/components/footer.js" defer></script>
<script type="module" src="../scripts/pages/singleBlog.js" defer></script>
</body>
</html>
