<style>.pt{--gold:#f2c94c;--line:rgba(255,255,255,.09);--up:#5fae8a;--dn:#c0686a;--dim:rgba(232,236,233,.5);overflow-x:auto}
.pt .meta{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;color:var(--dim);font-size:12px}
.pt .live{font:500 11px 'JetBrains Mono',monospace;letter-spacing:.12em;color:var(--dim)}
.pt .live i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--up);margin-right:8px;vertical-align:1px;animation:bl 2s infinite}
@keyframes bl{50%{opacity:.25}}
.pt table{width:100%;border-collapse:collapse;font:400 13px 'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;border-top:1px solid rgba(242,201,76,.35);border-bottom:1px solid rgba(242,201,76,.35)}
.pt th{font:500 10px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);text-align:right;padding:11px 14px;border-bottom:1px solid var(--line)}
.pt th:first-child,.pt td:first-child{text-align:left}
.pt td{padding:9px 14px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.pt tr.grp td{font:500 10px Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);padding:16px 14px 7px;border-bottom:1px solid rgba(242,201,76,.2);text-align:left}
.pt td.n{font-family:Inter,sans-serif;color:#e8ece9}
.pt td.n b{display:inline-block;width:46px;font:500 11px 'JetBrains Mono',monospace;color:var(--gold);opacity:.85}
.pt td.p{color:#fff;font-weight:500;transition:background 1.2s,color 1.2s}
.pt td.u,.pt td.s{color:var(--dim);font-size:11.5px}
.pt td.c.up{color:var(--up)}
.pt td.c.dn{color:var(--dn)}
.pt td.c.z{color:var(--dim)}
.pt td.p.fu{background:rgba(95,174,138,.22);color:#bfe8d3;transition:none}
.pt td.p.fd{background:rgba(192,104,106,.22);color:#f0c4c5;transition:none}
.pt tbody tr:not(.grp):hover td{background:rgba(242,201,76,.04)}
.pt svg.sp{width:120px;height:24px;vertical-align:middle}
.pt .foot{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:20px;flex-wrap:wrap}
.pt .note{font-size:11px;color:var(--dim);max-width:560px;line-height:1.6}
