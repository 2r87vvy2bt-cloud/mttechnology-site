<style>.dw-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .35s;z-index:900}.dw-ov.on{opacity:1;pointer-events:auto}
.dw{position:fixed;top:0;right:0;height:100%;width:min(440px,92vw);z-index:901;transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);background:linear-gradient(160deg,rgba(18,40,32,.88),rgba(0,0,0,.92));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-left:1px solid rgba(242,201,76,.45);box-shadow:-20px 0 60px rgba(0,0,0,.6);padding:64px 34px 34px;overflow-y:auto;color:var(--text)}.dw.on{transform:none}.dw.drag{transition:none}
.dw-x{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(242,201,76,.5);background:none;color:#f2c94c;font-size:20px;cursor:pointer}.dw-x:hover{background:rgba(242,201,76,.15)}
.dw-k{font:400 11px Inter,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:#f2c94c}.dw h3{font:300 36px/1.1 'Cormorant Garamond',serif;margin:12px 0 22px}.dw-ch{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:1px;background:rgba(242,201,76,.2);border:1px solid rgba(242,201,76,.2);margin-bottom:22px}.dw-ch div{background:rgba(0,0,0,.75);padding:14px}.dw-ch b{display:block;color:#f2c94c;font-size:13px}.dw-ch span{font:300 24px 'Cormorant Garamond',serif}
.dw-f div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}.dw-f span{opacity:.65}.dw-f b{font-weight:500;text-align:right}.dw-n{padding:14px 16px;border:1px solid rgba(242,201,76,.3);background:rgba(242,201,76,.06);font-size:14px;line-height:1.6;margin-bottom:22px}.dw .btn-gold{display:inline-block;margin-top:26px}
[data-dw]{cursor:pointer;position:relative}[data-dw]:focus-visible{outline:2px solid #f2c94c}.dw-more{display:inline-block;margin-left:8px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#f2c94c;opacity:.8}figure .dw-more,figure .dw-q{position:absolute;left:10px;bottom:10px;z-index:3;background:rgba(0,0,0,.7);padding:4px 9px;border:1px solid rgba(242,201,76,.4);margin:0}.dw-q{display:inline-block;margin-left:8px;font-size:10px;letter-spacing:.08em;color:var(--text-dim);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:1px 8px}figure .dw-q{top:10px;bottom:auto;color:#ddd}
body.dw-lock{overflow:hidden}@media(prefers-reduced-motion:reduce){.dw,.dw-ov{transition:none}}</style>
<div class="dw-ov" id="dwOv"></div><aside class="dw" id="dw" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="dwT"><button class="dw-x" id="dwX" aria-label="Закрыть">×</button><div id="dwB"></div></aside>
<script>(()=>{const d=document.getElementById('dw'),ov=document.getElementById('dwOv'),B=document.getElementById('dwB');let last=null,ht=null,cur=null;const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function open(k,src){const it=(window.DW||{})[k];if(!it)return;if(cur===k&&d.classList.contains('on'))return;cur=k;last=src||document.activeElement;
B.innerHTML='<div class="dw-k">'+esc(it.kick||'')+'</div><h3 id="dwT">'+esc(it.title)+'</h3>'+(it.note?'<div class="dw-n">'+esc(it.note)+'</div>':'')+(it.chh?'<div class="dw-k" style="margin:0 0 10px">'+esc(it.chh)+'</div>':'')+(it.rows?'<div class="dw-ch">'+it.rows.map(r=>'<div><b>'+esc(r[0])+'</b><span>'+esc(r[1])+'</span></div>').join('')+'</div>':'')+(it.note2?'<div class="dw-n">'+esc(it.note2)+'</div>':'')+(it.phh?'<div class="dw-k" style="margin:0 0 10px">'+esc(it.phh)+'</div>':'')+(it.phases?'<div class="dw-ch">'+it.phases.map(r=>'<div><b>'+esc(r[0])+'</b><span>'+esc(r[1])+'</span></div>').join('')+'</div>':'')+(it.facts?'<div class="dw-f">'+it.facts.map(r=>'<div><span>'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>').join('')+'</div>':'')+(it.price?'<div class="dw-n">'+esc(it.price)+'</div>':'')+'<a class="btn-gold" href="#contact">Запросить предложение</a>';
d.classList.add('on');ov.classList.add('on');d.setAttribute('aria-hidden','false');document.body.classList.add('dw-lock');document.getElementById('dwX').focus({preventScroll:true})}
function close(){if(!d.classList.contains('on'))return;d.classList.remove('on');ov.classList.remove('on');d.style.transform='';d.setAttribute('aria-hidden','true');document.body.classList.remove('dw-lock');cur=null;last&&last.focus&&last.focus({preventScroll:true})}
window.MTDrawer={open,close};document.getElementById('dwX').onclick=close;ov.onclick=close;B.addEventListener('click',e=>{if(e.target.closest('a[href="#contact"]'))close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();const t=e.target.closest&&e.target.closest('[data-dw]');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();open(t.dataset.dw,t)}});
const fine=matchMedia('(hover:hover) and (pointer:fine)').matches;document.querySelectorAll('[data-dw]').forEach(el=>{el.addEventListener('click',e=>{e.preventDefault();open(el.dataset.dw,el)});if(fine){el.addEventListener('mouseenter',()=>{clearTimeout(ht);ht=setTimeout(()=>open(el.dataset.dw,el),550)});el.addEventListener('mouseleave',()=>clearTimeout(ht))}});
let sx=null,dx=0;d.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;dx=0;d.classList.add('drag')},{passive:true});d.addEventListener('touchmove',e=>{if(sx===null)return;dx=Math.max(0,e.touches[0].clientX-sx);d.style.transform='translateX('+dx+'px)'},{passive:true});d.addEventListener('touchend',()=>{d.classList.remove('drag');d.style.transform='';if(dx>90)close();sx=null})})()</script>
