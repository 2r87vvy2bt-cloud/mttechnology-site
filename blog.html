<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>if(!localStorage.getItem('lang')){var b=(navigator.language||'').slice(0,2).toLowerCase();if(['en','ru','de'].indexOf(b)!==-1)localStorage.setItem('lang',b);}</script>
  <script src="../scripts/shared/analytics.js" data-cfasync="false"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/components/header.css" />
  <link rel="stylesheet" href="../assets/css/components/burger-dropdown.css" />
  <link rel="stylesheet" href="../assets/css/pages/blog.css" />
  <link rel="stylesheet" href="../assets/css/components/footer.css" />
  <link rel="stylesheet" href="../assets/css/components/blog-section.css" />
  <link rel="stylesheet" href="../assets/css/components/cookie.css" />
</head>
<body>

<div id="header-placeholder"></div>
<div id="burger-dropdown-placeholder"></div>

<div class="blog">
  <div class="container">
    <div class="blog__new">
      <div class="title">
        <span data-i18n="blog.page.new.titleBlue">NEW</span>
        <a data-i18n="blog.page.titleOrd">PUBLICATIONS</a>
        <p data-i18n="blog.page.new.subtitle">Open the article you are interested in to study it in more detail</p>
      </div>

      <div class="blog__new__grid"></div>

      <div class="blog__pager">
        <button id="new__pager-prev" class="pager__btn" aria-label="Previous">
          <svg
            class="icon-arrow"
            width="32" height="32"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M19 12H5M5 12L12 19M5 12L12 5"
              stroke="#475467"
              stroke-width="2.004"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <button id="new__pager-next" class="pager__btn" aria-label="Next">
          <svg
            class="icon-arrow"
            width="32" height="32"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M5 12H19M19 12L12 5M19 12L12 19"
              stroke="#475467"
              stroke-width="2.004"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

      </div>
    </div>
    <div class="blog__all">
      <div class="title">
        <span data-i18n="blog.page.all.titleBlue">ALL</span>
        <a data-i18n="blog.page.titleOrd">PUBLICATIONS</a>
        <p data-i18n="blog.page.all.subtitle">If you haven't found what you need, you can use the search by tags</p>
      </div>
      <div class="blog__all__search">
        <a id="tag-all" class="search__tag active" onclick="renderAll()">#All</a>
      </div>

      <button class="blog__filter-toggle" id="blog-filter-toggle" aria-label="Filter by tags">
        <span class="blog__filter-toggle__label" data-i18n="blog.filter.btn">Filter by tags</span>
        <span class="blog__filter-toggle__active" id="blog-filter-active">#All</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="blog__all__grid"></div>
    </div>
  </div>
</div>

<div class="blog__filter-backdrop" id="blog-filter-backdrop"></div>
<div class="blog__filter-sheet" id="blog-filter-sheet" role="dialog" aria-modal="true">
  <div class="blog__filter-sheet__handle"></div>
  <div class="blog__filter-sheet__header">
    <span data-i18n="blog.filter.title">Filter by tags</span>
    <button class="blog__filter-sheet__close" id="blog-filter-close" aria-label="Close">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div class="blog__filter-sheet__tags" id="blog-filter-sheet-tags"></div>
</div>

<div id="footer-placeholder"></div>

<script src="../scripts/shared/cookie.min.js"></script>
<script src="../scripts/shared/cookie.js"></script>
<script src="../scripts/shared/translations.js" defer></script>
<script src="../scripts/components/header.js" defer></script>
<script src="../scripts/components/burgerDropdownController.js" defer></script>
<script src="../scripts/components/footer.js" defer></script>
<script src="../scripts/shared/navButtons.js" defer></script>
<script type="module" src="../scripts/pages/blog.js" defer></script>
</body>
</html>
