<div class="smart-metal-sourcing">
  <div class="container">
    <div class="title">
      <span data-i18n="introduction.titleBlue">SMART</span>
      <a data-i18n="introduction.titleOrd">METAL SOURCING</a>
      <p data-i18n="introduction.subtitle">
        We create solutions — you focus on results
      </p>
    </div>

    <div class="smart-metal-sourcing__content">
      <div class="smart-metal-sourcing__top">

        <button class="pagination-btn pagination-btn--left" aria-label="Previous slide">
          <svg class="icon-arrow" width="32" height="32" viewBox="0 0 24 24" fill="none">
            <path d="M19 12H5M5 12L12 19M5 12L12 5" />
          </svg>
        </button>

        <div class="slides-wrapper"></div>
        <div class="smart-metal-sourcing__img-desc special-desc" data-i18n=""></div>
        <div class="smart-metal-sourcing__pagination"></div>

        <div class="smart-metal-sourcing__buttons">
          <a class="button top-button" onclick="goToConsultations()" data-i18n="buttons.consultationsBtn">Free Consultation</a>
          <a href="/buy-sell-product.html" class="button__prime  top-button" data-i18n="buttons.productsBtn">Buy / Sell Products</a>
        </div>

        <button class="pagination-btn pagination-btn--right" aria-label="Next slide">
          <svg class="icon-arrow" width="32" height="32" viewBox="0 0 24 24" fill="none">
            <path d="M5 12H19M19 12L12 5M19 12L12 19" />
          </svg>
        </button>

      </div>

      <div class="smart-metal-sourcing__info">
        <div class="smart-metal-sourcing__right-big">
          <img loading="lazy" src="../../public/images/metal-sourcing/shave.jpg" alt="shave-image" />
          <a class="smart-metal-sourcing__img-desc" data-i18n="introduction.imageContent.first">WE BUY TITANIUM SHAVE</a>

        <div class="smart-metal-sourcing__left-small">
          <img loading="lazy" src="../../public/images/metal-sourcing/exp.png" alt="exp-image" />
          <a class="smart-metal-sourcing__img-desc" data-i18n="introduction.imageContent.second">1000 consumers</a>
        </div>
      </div>

      <div class="smart-metal-sourcing__info">
        <div class="smart-metal-sourcing__right-small">
          <img loading="lazy" src="../../public/images/metal-sourcing/license.png" alt="license-image" class="license-image" />
          <a class="smart-metal-sourcing__img-desc" data-i18n="introduction.imageContent.third">There are all licenses for each type of raw material</a>
        </div>
        <div class="smart-metal-sourcing__left-big">
          <img loading="lazy" src="../../public/images/metal-sourcing/partners.png" alt="achievement-image" class="achievement-image" />
          <a class="smart-metal-sourcing__img-desc" data-i18n="introduction.imageContent.fourth">50+ Satisfied business partners</a>
        </div>
      </div>
    </div>
