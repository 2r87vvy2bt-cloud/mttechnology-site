<div class="blog-section">
  <div class="container">
    <div class="blog-section-header">
      <div class="title">
        <a data-i18n="blog.section.titleOrd">OUR UNIQUE</a>
        <span data-i18n="blog.section.titleBlue">BLOG</span>
        <p data-i18n="blog.section.subtitle">Open the article you are interested in to study it in more detail</p>
      </div>

      <a href="/blog.html" class="button blog__btn" data-i18n="buttons.toBlogBtn">Go to Blog</a>
    </div>

    <div class="blog-section__grid"></div>

    <div class="blog__pager">
      <button class="pager__btn" aria-label="Previous">
        <svg
          class="icon-arrow"
          width="32" height="32"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M19 12H5M5 12L12 19M5 12L12 5"
            stroke="#475467"
            stroke-width="2.004"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <button class="pager__btn" aria-label="Next">
        <svg
          class="icon-arrow"
          width="32" height="32"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M5 12H19M19 12L12 5M19 12L12 19"
            stroke="#475467"
            stroke-width="2.004"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>
  </div>

</div>
