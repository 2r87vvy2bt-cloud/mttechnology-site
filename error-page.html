<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>if(!localStorage.getItem('lang')){var b=(navigator.language||'').slice(0,2).toLowerCase();if(['en','ru','de'].indexOf(b)!==-1)localStorage.setItem('lang',b);}</script>
  <script src="../scripts/shared/analytics.js" data-cfasync="false"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Page</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/components/header.css" />
  <link rel="stylesheet" href="../assets/css/components/burger-dropdown.css" />
  <link rel="stylesheet" href="../assets/css/pages/error-page.css" />
  <link rel="stylesheet" href="../assets/css/components/cookie.css" />
</head>
<body>

<div id="header-placeholder"></div>
<div id="burger-dropdown-placeholder"></div>

<div class="error-page">
  <div class="container">
    <div class="error-page__content">
      <div class="error-page__left-part">
        <div class="title">
          <a>PAGE </a>
          <span>NOT FOUND</span>
          <p>Unfortunately, the page you are looking for <br>does not exist. Here are some helpful links:
          </p>
        </div>

        <div class="error-page__links">
          <a onclick="history.back()" class="button button__prime error-page__btn">Back</a>
          <a href="index.html" class="button error-page__btn">Home Page</a>
        </div>
      </div>
      <div class="error-page__right-part">
        <img loading="lazy" src="../../public/images/error.png" alt="404-img" />
      </div>
    </div>
  </div>
</div>


<script src="../scripts/shared/cookie.min.js"></script>
<script src="../scripts/shared/cookie.js"></script>
<script src="../scripts/shared/translations.js" defer></script>
<script src="../scripts/shared/navButtons.js" defer></script>
<script src="../scripts/components/header.js" defer></script>
<script src="../scripts/components/burgerDropdownController.js" defer></script>
<script type="module" src="../scripts/pages/errorPage.js" defer></script>
</body>
</html>
