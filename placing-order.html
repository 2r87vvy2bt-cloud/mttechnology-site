<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>if(!localStorage.getItem('lang')){var b=(navigator.language||'').slice(0,2).toLowerCase();if(['en','ru','de'].indexOf(b)!==-1)localStorage.setItem('lang',b);}</script>
  <script src="../scripts/shared/analytics.js" data-cfasync="false"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Placing an Order</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/components/header.css" />
  <link rel="stylesheet" href="../assets/css/components/burger-dropdown.css" />
  <link rel="stylesheet" href="../assets/css/pages/placing-order.css" />
  <link rel="stylesheet" href="../assets/css/components/footer.css" />
  <link rel="stylesheet" href="../assets/css/components/tech.css" />
  <link rel="stylesheet" href="../assets/css/components/catalog.css" />
  <link rel="stylesheet" href="../assets/css/components/introduction.css" />
  <link rel="stylesheet" href="../assets/css/components/cookie.css" />
</head>
<body>

<div id="header-placeholder"></div>
<div id="burger-dropdown-placeholder"></div>

<div class="order">
  <div class="container">
    <div class="title">
      <a data-i18n="placingOrder.titleOrd">PLACING AN</a>
      <span data-i18n="placingOrder.titleBlue">ORDER</span>
      <p data-i18n="placingOrder.subtitle">Read the description of the raw materials and fill out the form</p>
    </div>
    <div class="order__container">
      <div class="order__container__card"></div>
      <div class="order__container__form">
        <div class="tech__form">
          <form class="contact-form order__form" novalidate>
            <!-- Name (required) -->
            <div class="form-field">
              <label for="name" class="form-label" data-i18n="form.nameLabel">Name</label>
              <input
                id="name"
                name="name"
                type="text"
                class="form-input"
                placeholder="Enter name"
                data-i18n-placeholder="form.namePlaceholder"
                required
              />
              <p class="form-error-message"></p>
            </div>

            <!-- Email (required) -->
            <div class="form-field">
              <label for="email" class="form-label" data-i18n="form.emailLabel">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                class="form-input"
                placeholder="Enter email"
                data-i18n-placeholder="form.emailPlaceholder"
                required
              />
              <p class="form-error-message"></p>
            </div>

            <!-- Phone (optional) -->
            <div class="form-field">
              <label for="phone" class="form-label" data-i18n="form.phoneLabel">Phone number</label>
              <div class="input-with-icon">
                <input
                  id="phone"
                  name="phone"
                  type="tel"
                  class="form-input"
                  placeholder="Enter phone number"
                  data-i18n-placeholder="form.phonePlaceholder"
                />
                <span class="error-icon"></span>
              </div>
              <p class="form-error-message"></p>
            </div>

            <div class="form-field">
              <label for="description" class="form-label" data-i18n="form.descriptionLabel">
                Description (Optional)
              </label>
              <textarea
                id="description"
                name="description"
                class="form-textarea order-description"
                placeholder="Enter a description…"
                data-i18n-placeholder="form.descriptionPlaceholder"
                rows="4"
              ></textarea>
            </div>

            <div class="order__buttons">
              <a class="button__prime order-btn" onclick="history.back()" data-i18n="buttons.backBtn">Back</a>
              <button type="submit" class="button button__large order-btn" data-i18n="buttons.sendBtn">Send</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="../scripts/shared/cookie.min.js"></script>
<script src="../scripts/shared/cookie.js"></script>
<script src="../scripts/shared/translations.js" defer></script>
<script src="../scripts/components/header.js" defer></script>
<script src="../scripts/components/burgerDropdownController.js" defer></script>
<script src="../scripts/shared/navButtons.js" defer></script>
<script src="../scripts/components/footer.js" defer></script>
<script type="module" src="../scripts/pages/placingOrder.js" defer></script>
</body>
</html>
